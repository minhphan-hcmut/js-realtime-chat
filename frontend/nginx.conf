server {
    listen 80;
    server_name localhost; # Sau này có domain thì thay localhost bằng yourdomain.com

    # 1. Cấu hình phục vụ file tĩnh cho Frontend (React/Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Dòng này cực kỳ quan trọng cho React Router:
        # Nếu không tìm thấy file, nó sẽ đẩy về index.html để React xử lý điều hướng
        try_files $uri $uri/ /index.html;
    }

    # 2. Cấu hình Proxy sang Backend cho API
    location /api/v1/ {
        # 'backend' là tên service trong docker-compose của bạn
        proxy_pass http://backend:3000; 
        
        # Cấu hình Header để hỗ trợ Cloudflare và nhận diện IP thật của User
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ Cookies và Credentials (cho withCredentials: true của Axios)
        proxy_set_header Allow-Control-Allow-Origin $http_origin;
        proxy_set_header Allow-Control-Allow-Credentials "true";

        # Tăng thời gian timeout cho các request lâu (như upload file hoặc chat)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}