# =============================================================================
# docker-compose.prod.yml
# Deploy trên: prod-app-server (192.168.1.102)
#
# Cách dùng:
#   export IMAGE_BACKEND=registry.gitlab.com/your-username/js-realtime-chat/backend
#   export APP_VERSION=42
#   docker compose -f docker-compose.prod.yml up -d
#
# Lưu ý:
#   - Frontend KHÔNG có trong file này — được serve bởi Nginx cấu hình thủ công.
#   - Database (MongoDB + Redis) chạy trên prod-db-server (192.168.1.103).
#     Đảm bảo .env.prod có:
#       MONGODB_HOST=192.168.1.103
#       REDIS_URL=redis://192.168.1.103:6379
# =============================================================================

services:

  backend:
    image: ${IMAGE_BACKEND}:${APP_VERSION:-latest}
    container_name: js-realtime-chat-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.prod
    # Health check để Docker biết khi nào container thực sự sẵn sàng
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Giới hạn tài nguyên (tuỳ chỉnh theo VM specs)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
